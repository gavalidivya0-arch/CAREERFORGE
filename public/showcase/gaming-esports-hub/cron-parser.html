<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vortex Arena Cron Schedule Builder</title>
  <link rel="stylesheet" href="cron-parser.css">
</head>
<body>
  <main>
    <a href="index.html">&larr; Back to Vortex Arena</a>
    <h1>Cron schedule builder</h1>
    <p>Plan recurring jobs such as match reminders or leaderboard refreshes. Times use your local time zone.</p>
    <form onsubmit="return false">
      <label>Minute <input data-field value="0" autocomplete="off" spellcheck="false"></label>
      <label>Hour <input data-field value="18" autocomplete="off" spellcheck="false"></label>
      <label>Day <input data-field value="*" autocomplete="off" spellcheck="false"></label>
      <label>Month <input data-field value="*" autocomplete="off" spellcheck="false"></label>
      <label>Weekday <input data-field value="fri-sun" autocomplete="off" spellcheck="false"></label>
    </form>
    <div class="presets">
      <button type="button" data-preset="*/10 * * * *">Refresh leaderboard</button>
      <button type="button" data-preset="0 17 * * fri">Weekend match reminder</button>
      <button type="button" data-preset="0 3 * * mon">Weekly roster reset</button>
    </div>
    <code id="tokens"></code>
    <p id="explanation" role="status"></p>
    <h2>Next runs</h2>
    <ol id="runs"></ol>
  </main>
  <script type="module" src="cron-parser.js"></script>
</body>
</html>
