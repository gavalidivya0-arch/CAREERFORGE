<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nonprofit Impact — Trie Typeahead Autocomplete</title>
  <link rel="stylesheet" href="trie-search.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <main class="trie-search-main">
    <div class="trie-search-wrapper">
      <!-- Search Input -->
      <div class="trie-search-box">
        <span class="trie-search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="trie-search-input" placeholder="Search causes, projects, or initiatives..." aria-label="Type to search nonprofit causes" autocomplete="off" />
        <span class="trie-search-clear" id="trie-search-clear" aria-label="Clear search" hidden>✕</span>
      </div>

      <!-- Auto-suggest Dropdown -->
      <div class="trie-suggestions" role="listbox" id="trie-suggestions" aria-label="Auto-suggest results" hidden></div>
    </div>

    <!-- Trie Hierarchy Tree Viewer -->
    <section class="trie-tree-viewer" aria-labelledby="trie-tree-title">
      <h2 id="trie-tree-title">Trie Prefix Tree Hierarchy</h2>
      <p class="trie-tree-description">Visualizing the prefix tree structure with highlighted matches</p>
      <div class="trie-tree-container" id="trie-tree-container">
        <svg class="trie-svg" aria-hidden="true" viewBox="0 0 800 600">
          <!-- Tree nodes and edges will be rendered by JavaScript -->
        </svg>
        <div class="trie-empty-state" hidden>
          <p>Start typing to build the trie hierarchy</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { NonprofitImpactTrieEngine } from './trie-search.js';

    // Initialize the trie engine with sample nonprofit-related words
    const trieEngine = new NonprofitImpactTrieEngine();

    // Populate the trie with sample data related to nonprofit impact
    const sampleWords = [
      'clean water',
      'climate action',
      'education support',
      'healthcare access',
      'poverty relief',
      'reforestation',
      'solar power',
      'women empowerment',
      'child education',
      'microfinance',
      'disaster relief',
      'animal welfare',
      'conservation',
      'community development',
      'food security',
      'housing assistance',
      'literacy program',
      'vocational training',
      'emergency aid',
      'sustainable agriculture',
    ];

    sampleWords.forEach(word => trieEngine.insert(word));

    // DOM Elements
    const searchInput = document.getElementById('trie-search-input');
    const suggestionsDiv = document.getElementById('trie-suggestions');
    const treeContainer = document.getElementById('trie-tree-container');
    const emptyState = document.querySelector('.trie-empty-state');
    const searchBox = document.querySelector('.trie-search-box');
    const clearBtn = document.getElementById('trie-search-clear');

    // Render the trie tree SVG
    function renderTrieTree(matchPrefix = '') {
      const svg = treeContainer.querySelector('.trie-svg');
      if (!svg) return;

      const width = parseFloat(svg.getAttribute('viewBox')) || 800;
      const height = 600;
      const padding = 40;
      const branchLength = 40;
      const levelSpacing = 60;
      const childSpacing = 80;

      // Clear existing tree graphics
      svg.innerHTML = '';

      // BFS to position nodes
      const nodes = []; // { x, y, node, word, isMatch }
      const queue = [
        { node: trieEngine.root, x: width / 2, y: padding, prefix: '', depth: 0 }
      ];

      let maxWidth = 0;
      let maxHeight = 0;

      while (queue.length > 0) {
        const { node, x, y, prefix, depth } = queue.shift();
        nodes.push({ x, y, node, word: node.word, isMatch: false });

        // Check if this node's word starts with the match prefix
        if (matchPrefix && node.word && node.word.startsWith(matchPrefix)) {
          nodes[nodes.length - 1].isMatch = true;
        }

        const children = Array.from(node.children.values());
        const numChildren = children.length;

        if (numChildren === 0) {
          // Leaf node - no children to position
          continue;
        }

        // Calculate available width for children subtree
        const childTotalWidth = numChildren * childSpacing;
        const startX = x - childTotalWidth / 2 + childSpacing / 2;

        for (let i = 0; i < numChildren; i++) {
          const child = children[i];
          const childX = startX + i * childSpacing;
          const childY = y + levelSpacing;

          // Draw edge line from parent to child
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          const isLast = i === numChildren - 1;
          const branchColor = matchPrefix && node.word && node.word.startsWith(matchPrefix)
            ? '#22c55e'
            : '#3b82f6';
          const glow = matchPrefix && node.word && node.word.startsWith(matchPrefix)
            ? '2' : '0';

          line.setAttribute('x1', String(x));
          line.setAttribute('y1', String(y));
          line.setAttribute('x2', String(childX));
          line.setAttribute('y2', String(childY));
          line.setAttribute('stroke', branchColor);
          line.setAttribute('stroke-width', String(2 + (matchPrefix ? 1 : 0)));
          line.setAttribute('stroke-linecap', 'round');
          // Add glow effect for matched prefixes
          if (matchPrefix && node.word && node.word.startsWith(matchPrefix)) {
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const radialGradient = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
            radialGradient.setAttribute('id', `glow-${i}`);
            radialGradient.setAttribute('cx', '0%');
            radialGradient.setAttribute('cy', '0%');
            radialGradient.setAttribute('r', '50%');
            const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop1.setAttribute('offset', '0%');
            stop1.setAttribute('stop-color', branchColor);
            stop1.setAttribute('stop-opacity', '0.8');
            const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop2.setAttribute('offset', '100%');
            stop2.setAttribute('stop-color', branchColor);
            stop2.setAttribute('stop-opacity', '0.1');
            radialGradient.appendChild(stop1);
            radialGradient.appendChild(stop2);
            defs.appendChild(radialGradient);
            svg.appendChild(defs);
            line.setAttribute('stroke', `url(#glow-${i})`);
          }

          svg.appendChild(line);

          // Recurse
          queue.push({
            node: child,
            x: childX,
            y: childY,
            prefix: prefix + child,
            depth: depth + 1
          });
        }
      }

      // Render node circles and labels
      nodes.forEach((n, idx) => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');

        // Determine node color
        const isMatch = n.isMatch;
        const color = isMatch ? '#22c55e' : '#6b7280';
        const fillColor = isMatch ? 'rgba(34, 197, 94, 0.2)' : 'rgba(0, 0, 0, 0.3)';

        circle.setAttribute('cx', String(n.x));
        circle.setAttribute('cy', String(n.y));
        circle.setAttribute('r', '8');
        circle.setAttribute('fill', fillColor);
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-width', isMatch ? '3' : '1');
        circle.setAttribute('class', 'trie-node');
        if (isMatch) circle.setAttribute('data-match', 'true');
        svg.appendChild(circle);

        // Text label
        text.setAttribute('x', String(n.x));
        text.setAttribute('y', String(n.y + 4));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-family', '"JetBrains Mono", monospace`');
        text.setAttribute('font-size', '10');
        text.setAttribute('fill', color);
        text.setAttribute('pointer-events', 'none');
        text.textContent = n.word || '—';
        svg.appendChild(text);
      });

      // Show empty state if no nodes
      if (nodes.length === 0 || (nodes.length === 1 && !nodes[0].word)) {
        emptyState.hidden = false;
        treeContainer.hidden = true;
      } else {
        emptyState.hidden = true;
        treeContainer.hidden = false;
      }
    }

    // Render suggestions list
    function renderSuggestions(matches) {
      suggestionsDiv.hidden = matches.length === 0;
      if (matches.length === 0) return;

      suggestionsDiv.innerHTML = '';

      matches.forEach((word, idx) => {
        const item = document.createElement('div');
        item.className = 'trie-suggestion-item';
        item.setAttribute('role', 'option');
        item.setAttribute('aria-selected', 'false');
        item.setAttribute('aria-label', `Suggestion: ${word}`);

        // Highlight the prefix match
        const lowerWord = word.toLowerCase();
        const lowerInput = searchInput.value.toLowerCase();
        let displayText = word;

        if (lowerInput && lowerInput.length > 0) {
          const regex = new RegExp(`(${lowerInput})`, 'i');
          displayText = word.replace(regex, '<strong>$1</strong>');
        }

        item.innerHTML = `
          <span class="trie-suggestion-text">${displayText}</span>
          <span class="trie-suggestion-preview">✓</span>
        `;

        item.addEventListener('click', () => {
          searchInput.value = word;
          suggestionsDiv.hidden = true;
          clearBtn.hidden = false;
          // Render tree with the selected word as prefix
          renderTrieTree(word);
        });

        suggestionsDiv.appendChild(item);
      });
    }

    // Event: type in search input
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();

      // Clear suggestions and hide empty state
      suggestionsDiv.hidden = true;
      clearBtn.hidden = query.length === 0;

      if (!query) {
        renderTrieTree('');
        emptyState.hidden = true;
        treeContainer.hidden = false;
        return;
      }

      // Find words with exact prefix
      const prefixMatches = trieEngine.findWordsWithPrefix(query);

      // Find fuzzy matches (within Levenshtein distance 1 or 2)
      const fuzzyMatches = trieEngine.fuzzySearch(query, 2);

      // Combine and deduplicate
      const allMatches = [...new Set([...prefixMatches, ...fuzzyMatches])];

      // Sort: prefix matches first, then fuzzy, both alphabetically
      const sortedMatches = allMatches.sort((a, b) => {
        // Priority: exact prefix matches first
        const aIsPrefix = a.toLowerCase().startsWith(query.toLowerCase());
        const bIsPrefix = b.toLowerCase().startsWith(query.toLowerCase());
        if (aIsPrefix && !bIsPrefix) return -1;
        if (!aIsPrefix && bIsPrefix) return 1;
        return a.toLowerCase().localeCompare(b.toLowerCase());
      });

      renderSuggestions(sortedMatches);
      renderTrieTree(query);
    });

    // Event: click outside to hide suggestions
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.trie-search-wrapper')) {
        suggestionsDiv.hidden = true;
        clearBtn.hidden = true;
        searchInput.blur();
      }
    });

    // Event: clear button
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      suggestionsDiv.hidden = true;
      clearBtn.hidden = true;
      renderTrieTree('');
    });

    // Initial render
    renderTrieTree('');
  </script>
</body>
</html>
