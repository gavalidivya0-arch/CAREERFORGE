<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart IoT Nexus - Distributed Raft Consensus</title>
  <link rel="stylesheet" href="raft-consensus.css" />
</head>
<body>
  <div class="raft-container">
    <header class="raft-header">
      <div class="raft-title">Distributed Raft Consensus Cluster</div>
      <div class="raft-info">
        <span>Term: <strong id="term-counter">0</strong></span>
        <span id="vote-status"></span>
      </div>
    </header>

    <div class="raft-controls">
      <button class="btn ctrl-btn" id="kill-node-1">Kill Node 1</button>
      <button class="btn ctrl-btn" id="kill-node-2">Kill Node 2</button>
      <button class="btn ctrl-btn" id="kill-node-3">Kill Node 3</button>
      <br /><br />
      <label class="ctrl-label">
        <input type="checkbox" id="partition-toggle" />
        Partition Network
      </label>
    </div>

    <div class="raft-nodes">
      <div class="node-card node-1" id="node-1">
        <div class="node-state">Follower</div>
        <div class="node-id">NODE-1</div>
        <div class="node-term">Term: 0</div>
        <div class="node-log-log"></div>
      </div>
      <div class="node-card node-2" id="node-2">
        <div class="node-state">Follower</div>
        <div class="node-id">NODE-2</div>
        <div class="node-term">Term: 0</div>
        <div class="node-log-log"></div>
      </div>
      <div class="node-card node-3" id="node-3">
        <div class="node-state">Follower</div>
        <div class="node-id">NODE-3</div>
        <div class="node-term">Term: 0</div>
        <div class="node-log-log"></div>
      </div>
    </div>

    <div class="raft-log-panel">
      <h3>Log Replication</h3>
      <div class="log-header">
        <span>Index</span>
        <span>Command</span>
        <span>Leader</span>
        <span>Status</span>
      </div>
      <div class="log-entries" id="log-entries">
        <div class="log-entry empty">empty</div>
        <div class="log-entry empty">empty</div>
        <div class="log-entry empty">empty</div>
      </div>
    </div>
  </div>

  <script type="module" src="raft-consensus.js"></script>
</body>
</html>
